<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>PBB LIVE STUDIO - Maintenance</title>
  <style>
    :root {
      --glass-bg: rgba(20, 20, 25, 0.45); 
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
      --accent-blue: #0a84ff;
      --accent-red: #ff375f;
      --mac-text: #ffffff;
      --mac-subtext: rgba(235, 235, 245, 0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #000000; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--mac-text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Mesh Background */
    .ambient-bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #111116 0%, #000000 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6;
      animation: floatOrb 25s ease-in-out infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; background: #5e5ce6; top: -20%; left: -10%; }
    .orb-2 { width: 600px; height: 600px; background: #ff375f; bottom: -20%; right: -20%; animation-delay: -8s; }
    .orb-3 { width: 400px; height: 400px; background: #0a84ff; top: 30%; left: 40%; opacity: 0.4; animation-delay: -15s; }
    
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, -50px) scale(1.15); }
    }

    /* Maintenance Glass Card */
    .maintenance-card {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(60px) saturate(220%);
      -webkit-backdrop-filter: blur(60px) saturate(220%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
      padding: 48px 40px;
      width: 90%; max-width: 420px;
      animation: cardFloat 6s ease-in-out infinite alternate, cardReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(20px) scale(0.95);
    }

    @keyframes cardReveal {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cardFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    /* Icon Styling */
    .icon-container {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative;
    }
    .icon-container::after {
      content: ''; position: absolute; inset: -4px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
      z-index: -1; filter: blur(12px); opacity: 0.5;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .icon-container svg {
      color: #fff;
      width: 36px; height: 36px;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.6; transform: scale(1.05); }
    }

    /* Typography */
    .status-badge {
      background: rgba(255, 189, 46, 0.15);
      color: #ffbd2e; border: 1px solid rgba(255, 189, 46, 0.3);
      font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
      padding: 4px 10px; border-radius: 99px; text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px; font-size: 22px; font-weight: 700;
      letter-spacing: 0.02em; color: rgba(255,255,255,0.9);
    }
    p {
      margin: 0 0 24px; font-size: 14px; line-height: 1.5;
      color: var(--mac-subtext);
    }
    
    .loader {
      display: flex; gap: 6px; justify-content: center; margin-top: 10px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mac-subtext);
      animation: dotBounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Author Watermark */
    #author-watermark {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      display: flex; align-items: center; gap: 8px;
      background: rgba(20, 20, 25, 0.45);
      backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
      padding: 8px 16px; border-radius: 99px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.15em;
      color: var(--mac-subtext); text-transform: uppercase;
      pointer-events: none; user-select: none;
      animation: watermarkReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.5s; opacity: 0; transform: translateY(15px);
    }
    #author-watermark span { color: #ffffff; font-weight: 800; }
    #author-watermark svg { color: var(--accent-blue); filter: drop-shadow(0 0 6px rgba(10, 132, 255, 0.8)); }
    @media (max-width: 820px) {
      #author-watermark { bottom: 16px; right: 16px; padding: 6px 12px; font-size: 8.5px; }
    }
    @keyframes watermarkReveal { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- Ambient macOS Wallpaper Orbs -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Central Maintenance Card -->
  <div class="maintenance-card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
      </svg>
    </div>
    
    <div class="status-badge">System Update</div>
    <h1>Updating Live Feeds</h1>
    <p>We are currently refreshing the server keys to bring you the latest streams. The studio broadcast will resume shortly.</p>
    
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // --- Secure Watermark Injection ---
    (function injectWatermark() {
      var wm = document.createElement('div');
      wm.id = 'author-watermark';
      wm.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>ENCODED BY <span>KARLDANEMAIPO</span>';
      document.body.appendChild(wm);
    })();

    // --- Anti-Sniffing & Inspector Protection ---
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); }
      if (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); }
      if (e.ctrlKey && (e.key.toLowerCase() === 'u' || e.keyCode === 85)) { e.preventDefault(); }
      if (e.metaKey && e.altKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'u' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 85)) { e.preventDefault(); }
    });
  </script>

</body>
</html>
